[project]
name = "dcfg-mcp"
version = "0.1.0"
description = "Data Center Field Guides MCP server: liquid-loop hydraulics, SOP/MOP/EOP classification, and ANSI/ISA-71.04 corrosion coupon classification."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tristan (Data Center Field Guides)" }]
requires-python = ">=3.10"
keywords = ["mcp", "data-center", "liquid-cooling", "commissioning", "isa-71.04", "mop", "sop", "eop"]
dependencies = ["mcp>=2.0,<3"]

[project.urls]
Homepage = "https://datacenterfieldguides.com"

[project.scripts]
dcfg-mcp = "dcfg_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcfg_mcp"]
